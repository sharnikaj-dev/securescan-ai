rules:
  - id: securescan.sqli.string-concat
    languages: [python, javascript, typescript, java, php]
    severity: ERROR
    message: Potential SQL Injection via unparameterized string interpolation or concatenation in database query.
    metadata:
      category: SQL Injection
      cwe: CWE-89
      owasp: A03:2021 - Injection
      remediation: Use parameterized queries or prepared statements with bound parameters instead of concatenating user-controlled input into SQL strings.

  - id: securescan.xss.unsafe-dom-sink
    languages: [javascript, typescript, php, python]
    severity: ERROR
    message: Potential Cross-Site Scripting (XSS) via unsafe DOM sink or unescaped template rendering.
    metadata:
      category: Cross-Site Scripting (XSS)
      cwe: CWE-79
      owasp: A03:2021 - Injection
      remediation: Use safe framework bindings, textContent, or a strict HTML sanitizer such as DOMPurify before rendering untrusted data.

  - id: securescan.csrf.disabled-protection
    languages: [python, javascript, typescript, php, java]
    severity: WARNING
    message: CSRF protection appears explicitly disabled or cookies lack SameSite safeguards.
    metadata:
      category: Cross-Site Request Forgery (CSRF)
      cwe: CWE-352
      owasp: A01:2021 - Broken Access Control
      remediation: Enforce anti-CSRF tokens on state-changing requests and configure session cookies with explicit SameSite attributes.

  - id: securescan.secrets.hardcoded-credential
    languages: [python, javascript, typescript, java, php, c, cpp]
    severity: ERROR
    message: Hardcoded password, private key, or API credential detected in source code.
    metadata:
      category: Hardcoded Credentials
      cwe: CWE-798
      owasp: A07:2021 - Identification and Authentication Failures
      remediation: Remove credentials from source code and inject secrets at runtime through environment variables or a managed secrets vault.

  - id: securescan.auth.insecure-authentication
    languages: [python, javascript, typescript, java, php]
    severity: ERROR
    message: Insecure authentication logic detected (plaintext password check, weak JWT validation, or permissive auth bypass).
    metadata:
      category: Insecure Authentication
      cwe: CWE-287
      owasp: A07:2021 - Identification and Authentication Failures
      remediation: Verify passwords with a slow adaptive hash (scrypt, bcrypt, or Argon2) using constant-time comparison and enforce signed token verification.

  - id: securescan.cmdi.shell-execution
    languages: [python, javascript, typescript, java, php, c, cpp]
    severity: ERROR
    message: Potential OS Command Injection via shell invocation or unsafe process execution.
    metadata:
      category: Command Injection
      cwe: CWE-78
      owasp: A03:2021 - Injection
      remediation: Avoid shell=True or shell wrappers; invoke executables directly with an argument array and validate inputs against a strict allowlist.

  - id: securescan.path.traversal-file-access
    languages: [python, javascript, typescript, java, php, c, cpp]
    severity: ERROR
    message: Potential Path Traversal via unvalidated file path construction.
    metadata:
      category: Path Traversal
      cwe: CWE-22
      owasp: A01:2021 - Broken Access Control
      remediation: Resolve canonical paths and verify the final path starts with the intended base directory separator before opening or reading files.

  - id: securescan.deserialization.untrusted-object
    languages: [python, javascript, typescript, java, php]
    severity: ERROR
    message: Insecure deserialization of untrusted payloads (pickle, unsafe YAML load, ObjectInputStream, or PHP unserialize).
    metadata:
      category: Insecure Deserialization
      cwe: CWE-502
      owasp: A08:2021 - Software and Data Integrity Failures
      remediation: Replace binary/object deserialization with safe data formats such as JSON or yaml.safe_load with schema validation.

  - id: securescan.crypto.weak-algorithm
    languages: [python, javascript, typescript, java, php, c, cpp]
    severity: WARNING
    message: Weak or broken cryptographic primitive detected (MD5, SHA-1, DES, ECB mode, or non-CSPRNG randomness).
    metadata:
      category: Weak Cryptographic Practices
      cwe: CWE-327
      owasp: A02:2021 - Cryptographic Failures
      remediation: Migrate to SHA-256/SHA-3 for hashing, AES-GCM or ChaCha20-Poly1305 for encryption, and CSPRNG APIs for tokens.

  - id: securescan.exposure.sensitive-info
    languages: [python, javascript, typescript, java, php, c, cpp]
    severity: WARNING
    message: Potential Sensitive Information Exposure via debug mode, stack trace disclosure, or secret logging.
    metadata:
      category: Sensitive Information Exposure
      cwe: CWE-200
      owasp: A05:2021 - Security Misconfiguration
      remediation: Disable debug modes in production, mask sensitive fields before logging, and return generic error messages to external clients.

  - id: securescan.file.insecure-handling
    languages: [python, javascript, typescript, java, php, c, cpp]
    severity: WARNING
    message: Insecure file handling detected (unbounded upload, unsafe temp file, or dangerous C buffer copy).
    metadata:
      category: Insecure File Handling
      cwe: CWE-434
      owasp: A04:2021 - Insecure Design
      remediation: Validate file extensions and sizes, store uploads outside the web root with generated filenames, and replace unsafe C functions with bounded alternatives.

  - id: securescan.ssrf.unvalidated-request
    languages: [python, javascript, typescript, java, php]
    severity: ERROR
    message: Potential Server-Side Request Forgery (SSRF) via unvalidated outbound URL or disabled TLS certificate verification.
    metadata:
      category: Server-Side Request Forgery (SSRF)
      cwe: CWE-918
      owasp: A10:2021 - Server-Side Request Forgery
      remediation: Validate outbound URLs against an explicit host allowlist, block private/loopback/metadata IP ranges, and keep TLS verification enabled.
